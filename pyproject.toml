[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-monitor"
version = "0.1.0"
description = "Macro Context Monitor — read-only observation-and-hypothesis-proposal layer for internal-research-service paper strategies"
readme = "README.md"
# Bumped from >=3.10: fleet-logging (below) requires Python >=3.11. CI runs 3.12, and the
# desktop deploy host's python3 is 3.12.3, so this raises the declared floor to match reality
# rather than lowering fleet-logging's.
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Preston Bernstein", email = "contact@prestonbernstein.com" }]
# NB (FR-12 structural guard): this list MUST NOT contain internal-research-service / algo_factory.
# The absence of that dependency is what makes an accidental `import algo_factory` fail
# at import time, not just at code review. Do not add it.
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    # Shared internal-infra CONVENTIONS.md §18 logging + yaml/env config loader (see src/macro_monitor
    # log.py and config.py, now thin wrappers around this). Pinned to an exact commit, not a
    # floating branch, matching the scraper-commons pattern (see internal-research-service/pyproject.toml).
    # Bump this pin by hand when a newer fleet-logging commit is wanted.
    "fleet-logging @ git+https://github.com/preston-bernstein/fleet-logging.git@fab3ce04dbd1b16479527fe4a512c6f8d1f960fb",
    # Same pattern as fleet-logging above (git+ssh pinned to an exact commit, not a floating
    # branch). Bump this pin by hand when a newer feed-commons commit is wanted.
    "feed-commons @ git+https://github.com/preston-bernstein/feed-commons.git@78fd77470345fe0fd63b961eb57e383cf60a1197",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
macro-monitor = "macro_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test performs a live network fetch (skips gracefully if unreachable)",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/macro_monitor/collector_rss.py"]
# Scoped to the tests that actually exercise collector_rss.py -- repo-hygiene tests elsewhere
# (test_gitignore.py, test_slash_command_allowlist.py, etc.) read repo-root files mutmut's sandbox
# doesn't copy and would fail there for reasons unrelated to any mutation.
pytest_add_cli_args_test_selection = [
    "-m", "not network",
    "tests/test_collect_rss.py", "tests/test_cli.py", "tests/test_no_forbidden_imports.py",
]
