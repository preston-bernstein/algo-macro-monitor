# Copy to config.yaml (gitignored). Runtime configuration for macro-monitor.

# Path to a transaction-consistent, read-only paper.db snapshot. How that snapshot gets
# refreshed and who can read it is entirely up to your own deployment (see ops/ for one worked
# example using SQLite's backup API + a periodic timer and a dedicated read-only group).
# Overridable via the MACRO_MONITOR_PAPER_DB_PATH env var without editing this file.
paper_db_path: /var/lib/macro-monitor/paper.db

# Local append-only observation/correlation log (gitignored, WAL mode).
db_path: data/macro_monitor.db

# Where terminal candidate-hypothesis reports are written (gitignored, FR-15).
reports_dir: reports

# Minimum days between LLM review runs. FR-07: default >= 7, overridable ONLY to a larger value.
review_min_days: 7

# Manually-synced snapshot of the tracked-strategy symbol universe (the distinct symbols your
# own paper-trading strategies trade). Deliberately NOT a live import of any trading package.
# Used only to tag observations for later human/agent review.
symbol_universe:
  - SPY
  - QQQ
  - IWM
  - TLT
  - IEF
  - GLD
  - HYG
  - LQD
  - VXX
