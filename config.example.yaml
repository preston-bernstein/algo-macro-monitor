# Copy to config.yaml (gitignored). Runtime configuration for macro-monitor.

# Path to the transaction-consistent, read-only paper.db snapshot maintained by
# paper-db-snapshot.timer (refreshed every 15 min). The algo-macro service user reads this
# directly via its paper-readers group membership — no SSH, no sudo (see docs/DECISIONS.md, FR-17).
paper_db_path: /srv/paper-share/paper.db

# Local append-only observation/correlation log (gitignored, WAL mode).
db_path: data/macro_monitor.db

# Where terminal candidate-hypothesis reports are written (gitignored, FR-15).
reports_dir: reports

# Minimum days between LLM review runs. FR-07: default >= 7, overridable ONLY to a larger value.
review_min_days: 7

# Manually-synced snapshot of the tracked-strategy symbol universe (from paper.db targets/marks
# distinct symbols). Deliberately NOT a live import of algo-factory. Used to tag observations.
symbol_universe:
  - SPY
  - QQQ
  - IWM
  - TLT
  - IEF
  - GLD
  - HYG
  - LQD
  - VXX
